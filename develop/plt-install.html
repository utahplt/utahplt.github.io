<H1>Installing a .plt File</H1>
<p>To install a <tt>.plt</tt> file, download it
to your machine, and then use DrScheme's
<b>Install .plt File...</b> menu item.
</p>
<p>Instead of using DrScheme, you can also 
provide the path to the file to Setup PLT
(i.e., <tt>setup-plt</tt> under Unix).
</p>
</body>
